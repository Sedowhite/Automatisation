name: Générer les codes-barres manquants

on:
  # Le déclencheur "schedule" natif de GitHub Actions n'est plus utilisé :
  # testé en conditions réelles (voir README), il a montré des écarts de
  # plusieurs heures malgré un cron réglé sur 5 minutes. Le déclenchement
  # fiable se fait désormais via un cron externe (cron-job.org) qui appelle
  # l'API GitHub pour déclencher ce workflow_dispatch toutes les 5 minutes.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Évite deux exécutions de déploiement Pages en même temps si un run dépasse l'intervalle du cron
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code (branche main)
        uses: actions/checkout@v7

      # Les fichiers auto-générés (registre + pages HTML + mapping catégories)
      # vivent sur une branche séparée "data", jamais sur "main". Ça évite tout
      # conflit entre les commits automatiques du bot et les push de code de
      # l'utilisateur sur main.
      - name: Checkout des données persistantes (branche data)
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer les codes-barres manquants et les étiquettes
        env:
          LOYVERSE_ACCESS_TOKEN: ${{ secrets.LOYVERSE_ACCESS_TOKEN }}
          DATA_DIR: data
        run: node generate-missing-barcodes.js

      # Sans cette étape, generated-labels.json / nouveaux.html ne seraient
      # générés que dans l'environnement temporaire du run et perdus à la fin :
      # le run suivant repartirait d'un dépôt vide et écraserait tout l'historique.
      - name: Committer l'état mis à jour (registre + pages HTML) sur la branche data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: data
          commit_message: "chore: mise à jour automatique des codes-barres générés"
          file_pattern: >-
            generated-labels.json
            nouveaux.html
            catalogue-detail.html
            legende.html
            legend-data.json
            styles.css
            search.js
            dernier-vidage.json
            category-prefix-map.json

      # Copie INTÉGRALE de data/ (hors .git), pas une liste de fichiers codée
      # en dur : cette liste avait été oubliée lors de l'ajout de legende.html/
      # legend-data.json, causant un 404 permanent sur cette page à chaque
      # republication par ce workflow (corrigé le 2026-09-13 — voir
      # publish-only.yml qui utilise déjà cette même méthode depuis le début).
      - name: Préparer le site à publier
        run: |
          mkdir -p site
          cp -r data/. site/
          rm -rf site/.git
          cp data/nouveaux.html site/index.html

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout des données (branche data)
        uses: actions/checkout@v7
        with:
          ref: data

      - name: Vérifier que le site publié contient les derniers produits
        env:
          SITE: https://sedowhite.github.io/Automatisation
          GH_TOKEN: ${{ github.token }}
        run: |
          codes=$(node -e "const r=require('./generated-labels.json');console.log(r.slice(-3).map(e=>e.code).join(' '))")
          echo "SKU à vérifier : $codes"
          check() {
            curl -s "$SITE/catalogue-detail.html?cb=${GITHUB_RUN_ID}-$1-$RANDOM" -o /tmp/live.html
            missing=""
            for c in $codes; do
              grep -q "data-code=\"$c\"" /tmp/live.html || missing="$missing $c"
            done
            echo "$missing"
          }
          for i in 1 2 3 4 5 6; do
            m=$(check $i)
            [ -z "$m" ] && echo "OK : site à jour" && exit 0
            echo "Tentative $i : manquants :$m"; sleep 20
          done
          echo "::warning::Site périmé, relance de la publication"
          curl -sI "$SITE/catalogue-detail.html?cb=$RANDOM" | grep -i -E "^(etag|last-modified|age|x-cache|x-served-by|cache-control)" || true
          last=$(gh run list --workflow publish-only.yml --repo "$GITHUB_REPOSITORY" --limit 1 --json createdAt -q '.[0].createdAt')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 900 ]; then
            echo "publish-only lancé il y a moins de 15 min, pas de relance"
          else
            gh workflow run publish-only.yml --repo "$GITHUB_REPOSITORY"
          fi
          sleep 120
          m=$(check retry)
          [ -z "$m" ] && echo "OK après relance" && exit 0
          echo "::error::Site toujours périmé, manquants :$m"
          exit 1
