name: Générer les codes-barres manquants

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Évite deux exécutions de déploiement Pages en même temps si un run dépasse 15 min
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer les codes-barres manquants et les étiquettes
        env:
          LOYVERSE_ACCESS_TOKEN: ${{ secrets.LOYVERSE_ACCESS_TOKEN }}
        run: node generate-missing-barcodes.js

      # Sans cette étape, generated-labels.json / catalogue-complet.html / nouveaux.html
      # ne seraient générés que dans l'environnement temporaire du run et perdus à la fin :
      # le run suivant repartirait d'un dépôt vide et écraserait tout l'historique.
      - name: Committer l'état mis à jour (registre + pages HTML)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mise à jour automatique des codes-barres générés"
          file_pattern: >-
            generated-labels.json
            catalogue-complet.html
            nouveaux.html
            dernier-vidage.json
            category-prefix-map.json

      - name: Préparer le site à publier
        run: |
          mkdir -p site
          if [ -f nouveaux.html ]; then
            cp nouveaux.html site/index.html
          else
            echo "<h1>Aucune étiquette à imprimer pour le moment</h1>" > site/index.html
          fi
          if [ -f catalogue-complet.html ]; then
            cp catalogue-complet.html site/catalogue-complet.html
          fi

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
