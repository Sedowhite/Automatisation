name: Marquer les nouveautés comme imprimées

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Même groupe que le job generate du cron : jamais deux écritures sur
    # "data" en même temps (avant : groupe "pages" au niveau du workflow entier).
    concurrency:
      group: generate-barcodes
      cancel-in-progress: false
    outputs:
      data_sha: ${{ steps.version.outputs.sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
    steps:
      - name: Checkout du code (branche main)
        uses: actions/checkout@v7

      # Même principe que generate-barcodes.yml : les données vivent sur "data",
      # jamais sur "main".
      - name: Checkout des données persistantes (branche data)
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vider la liste des nouveautés (sans toucher au catalogue)
        env:
          DATA_DIR: data
        run: node reset-nouveaux.js

      - name: Committer le vidage sur la branche data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: data
          commit_message: "chore: nouveautés marquées comme imprimées"
          file_pattern: >-
            nouveaux.html
            dernier-vidage.json

      - name: Noter le commit data publié
        id: version
        run: echo "sha=$(git -C data rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Copie intégrale de data/ comme les 2 autres workflows (l'ancienne liste
      # oubliait legende.html et legend-data.json : la légende disparaissait du
      # site après chaque vidage).
      - name: Préparer le site à publier
        run: |
          mkdir -p site
          cp -r data/. site/
          rm -rf site/.git
          cp data/nouveaux.html site/index.html

      - name: Uploader l'artefact GitHub Pages
        id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: reset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du script de déploiement
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Déployer sur GitHub Pages (version = commit data)
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.reset.outputs.artifact_id }}
          PAGES_BUILD_VERSION: ${{ needs.reset.outputs.data_sha }}
        run: python3 scripts/deploy_pages.py --artifact-id "$ARTIFACT_ID"
