name: Marquer les nouveautés comme imprimées

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Même groupe que generate-barcodes.yml : évite qu'un déploiement Pages de ce
# workflow et un déploiement du cron toutes les 15 min se marchent dessus.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vider la liste des nouveautés (sans toucher au catalogue complet)
        run: node reset-nouveaux.js

      - name: Committer le vidage
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: nouveautés marquées comme imprimées"
          file_pattern: >-
            nouveaux.html
            dernier-vidage.json

      - name: Préparer le site à publier
        run: |
          mkdir -p site
          cp nouveaux.html site/index.html
          if [ -f catalogue-complet.html ]; then
            cp catalogue-complet.html site/catalogue-complet.html
          fi

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: reset
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
