name: Marquer les nouveautés comme imprimées

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Même groupe que generate-barcodes.yml : évite qu'un déploiement Pages de ce
# workflow et un déploiement du cron se marchent dessus.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code (branche main)
        uses: actions/checkout@v4

      # Même principe que generate-barcodes.yml : les données vivent sur "data",
      # jamais sur "main".
      - name: Checkout des données persistantes (branche data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vider la liste des nouveautés (sans toucher au catalogue complet)
        env:
          DATA_DIR: data
        run: node reset-nouveaux.js

      - name: Committer le vidage sur la branche data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: data
          commit_message: "chore: nouveautés marquées comme imprimées"
          file_pattern: >-
            nouveaux.html
            dernier-vidage.json

      - name: Préparer le site à publier
        run: |
          mkdir -p site
          cp data/nouveaux.html site/index.html
          cp data/nouveaux.html site/nouveaux.html
          for f in catalogue-complet.html catalogue-gros.html catalogue-detail.html styles.css search.js; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "site/$f"
            fi
          done

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: reset
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
